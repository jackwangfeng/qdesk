name: "Send a WeChat message via qdesk run"

# This is the canonical "yaml-driven test against a Mac host" example.
# Requires qdesk-mac --listen running locally. See README "Mac host mode".
#
# Run:
#   export GEMINI_API_KEY=...
#   export QDESK_MAC_API_KEY=$(cat ~/.qdesk-mac-key)
#   qdesk run examples/wechat-reply.qdesk.yaml

target: mac-host

mac:
  endpoint: http://127.0.0.1:8765
  api_key_env: QDESK_MAC_API_KEY
  bundle_id: com.tencent.xinWeChat

goal: |
  Open the conversation with "文件传输助手" (File Transfer) and send the
  message "hi from qdesk run".

# Explicit steps bypass vision-on-sidebar (Gemini Flash drifts on WeChat
# 4.x's purple chat list); cmd+f search is the path the legacy
# wechat.open_chat tool uses for the same reason.
steps:
  - Press Cmd+F to open WeChat's search bar at the top of the window.
  - Type the text "文件传输助手" into the search bar.
  - Press Return to open the top search result.
  - Click the empty white message input area at the bottom of the chat window.
  - Type the text "hi from qdesk run".
  - Press Return to send the message.

expect:
  - The most recent outgoing message in the chat reads "hi from qdesk run".

ttl_seconds: 180
max_steps: 18
